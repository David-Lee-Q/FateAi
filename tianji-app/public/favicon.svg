<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="45%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#C4B5FD" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ringStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 圆角渐变底 -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <!-- 星盘环 -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#ringStroke)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  <path d="M256 98 A 158 158 0 0 1 256 414" fill="none" stroke="#FDE68A" stroke-opacity="0.28" stroke-width="2"/>

  <!-- 北斗七星 -->
  <g fill="#FDE68A">
    <circle cx="256" cy="98" r="4"/>
    <circle cx="306" cy="122" r="3.2"/>
    <circle cx="342" cy="162" r="3.6"/>
    <circle cx="356" cy="212" r="3.2"/>
    <circle cx="332" cy="252" r="3.8"/>
    <circle cx="348" cy="292" r="3"/>
    <circle cx="324" cy="322" r="4"/>
  </g>
  <g stroke="#FDE68A" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M256 98 L306 122 L342 162 L356 212 L332 252 L348 292 L324 322"/>
  </g>

  <!-- 太极（金阳鱼 + 靛阴鱼） -->
  <circle cx="256" cy="256" r="106" fill="#2E1065"/>
  <path d="M256 150 A 106 106 0 0 1 256 362 A 53 53 0 0 0 256 256 A 53 53 0 0 1 256 150 Z" fill="url(#gold)"/>
  <circle cx="256" cy="203" r="20" fill="#2E1065"/>
  <circle cx="256" cy="309" r="20" fill="#FBBF24"/>

  <!-- 太极边缘微光 -->
  <circle cx="256" cy="256" r="106" fill="none" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
